<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 72" width="800" height="72">
  <defs><style>.mono{font-family:'JetBrains Mono','Courier New',monospace}</style></defs>
  <rect width="800" height="72" rx="14" fill="#090909"/>
  <rect x="0.5" y="0.5" width="799" height="71" rx="14" fill="none" stroke="#232320"/>
  <line x1="24" y1="36" x2="776" y2="36" stroke="#232320" stroke-dasharray="2 6"/>
  <rect x="330" y="24" width="140" height="24" rx="12" fill="#090909"/>
  <text x="400" y="40" text-anchor="middle" class="mono" font-size="13" fill="#8a8a82">connection <tspan fill="#c7f94a">closed</tspan>.</text>
  <text x="24" y="40" class="mono" font-size="12" fill="#8a8a82">&gt; <tspan fill="#f2f2ee">_</tspan>
    <animate attributeName="opacity" values="1;0.4;1" dur="1.4s" repeatCount="indefinite"/>
  </text>
  <text x="776" y="40" text-anchor="end" class="mono" font-size="11" fill="#4c4c46">thanks for scrolling</text>
</svg>
