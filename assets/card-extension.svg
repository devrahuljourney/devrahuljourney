    <style>.disp{font-family:'Space Grotesk','Segoe UI',system-ui,sans-serif}.body{font-family:'Inter','Segoe UI',system-ui,sans-serif}.mono{font-family:'JetBrains Mono','Courier New',monospace}</style>
  </defs>
  <rect x="2" y="2" width="796" height="176" rx="14" fill="#090909" stroke="#232320"/>
