<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 180" width="800" height="180" font-family="'JetBrains Mono','Courier New',monospace">
  <defs>
    <linearGradient id="exico" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#007ACC"/>
    </linearGradient>
    <filter id="exg"><feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="2" y="2" width="796" height="176" rx="12" fill="#0a0e16" stroke="#1b2535"/>
  <rect x="2" y="2" width="6" height="176" rx="2" fill="#22d3ee"/>

  <!-- extension icon tile -->
  <rect x="30" y="34" width="72" height="72" rx="14" fill="#0d1117" stroke="#22d3ee" stroke-opacity="0.5"/>
  <text x="66" y="84" text-anchor="middle" font-size="34" font-weight="700" fill="url(#exico)" filter="url(#exg)">&lt;/&gt;</text>

  <text x="124" y="52" font-size="20" font-weight="700" fill="#e6edf3" filter="url(#exg)">React Native Style Injector</text>
  <text x="124" y="74" font-size="12" fill="#8b949e">VS Code Marketplace<tspan fill="#484f58"> · </tspan>publisher <tspan fill="#22d3ee">rahul-dev</tspan></text>
  <text x="124" y="100" font-size="13" fill="#8b949e">Auto-injects missing styles straight into <tspan fill="#e6edf3">StyleSheet.create</tspan>. Zero setup.</text>

  <!-- stats -->
  <g font-size="12">
    <text x="124" y="134" fill="#3fb950" font-weight="700">350+<tspan fill="#8b949e" font-weight="400"> developers</tspan></text>
    <text x="260" y="134" fill="#febc2e" font-weight="700">★ live<tspan fill="#8b949e" font-weight="400"> on marketplace</tspan></text>
    <text x="440" y="134" fill="#58a6ff" font-weight="700">Alt+S<tspan fill="#8b949e" font-weight="400"> to trigger</tspan></text>
  </g>

  <!-- install command -->
  <rect x="124" y="146" width="560" height="22" rx="6" fill="#161b22"/>
  <text x="134" y="161" font-size="11" fill="#3fb950">$ <tspan fill="#e6edf3">ext install rahul-dev.rn-style-injector</tspan></text>
</svg>
