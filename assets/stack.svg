    <style>.disp{font-family:'Space Grotesk','Segoe UI',system-ui,sans-serif}.mono{font-family:'JetBrains Mono','Courier New',monospace}</style>
  </defs>
  <rect width="800" height="300" rx="14" fill="#090909"/>
