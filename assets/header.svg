<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="800" height="240" font-family="'JetBrains Mono','Courier New',monospace">
  <defs>
    <linearGradient id="hgrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e16"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="hname" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#a371f7"/>
    </linearGradient>
    <filter id="hglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="hgrid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#1b2535" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="240" rx="12" fill="url(#hgrad)"/>
  <rect width="800" height="240" rx="12" fill="url(#hgrid)" opacity="0.5"/>
  <rect x="0.5" y="0.5" width="799" height="239" rx="12" fill="none" stroke="#1b2535"/>

  <!-- title bar -->
  <rect width="800" height="34" rx="12" fill="#161b22"/>
  <rect y="24" width="800" height="10" fill="#161b22"/>
  <circle cx="22" cy="17" r="6" fill="#ff5f57"/>
  <circle cx="44" cy="17" r="6" fill="#febc2e"/>
  <circle cx="66" cy="17" r="6" fill="#28c840"/>
  <text x="400" y="22" text-anchor="middle" font-size="12" fill="#484f58">devrahuljourney@github — ~/profile</text>

  <!-- prompt -->
  <text x="34" y="78" font-size="13" fill="#3fb950">visitor<tspan fill="#8b949e">:</tspan><tspan fill="#58a6ff">~</tspan><tspan fill="#e6edf3">$ cat whoami.txt</tspan></text>

  <!-- name -->
  <text x="34" y="128" font-size="42" font-weight="700" fill="url(#hname)" filter="url(#hglow)">Rahul Kumar Verma</text>

  <!-- role -->
  <text x="34" y="158" font-size="15" fill="#8b949e">full stack developer<tspan fill="#484f58"> · </tspan>mern<tspan fill="#484f58"> · </tspan>react native<tspan fill="#484f58"> · </tspan>real products</text>

  <!-- tagline -->
  <text x="34" y="190" font-size="14" fill="#22d3ee">&gt; building CoSkill — skill sharing that actually works.</text>

  <!-- status line -->
  <g font-size="12">
    <circle cx="40" cy="214" r="4" fill="#3fb950"><animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/></circle>
    <text x="52" y="218" fill="#8b949e">online</text>
    <text x="120" y="218" fill="#484f58">│</text>
    <text x="140" y="218" fill="#8b949e">open to <tspan fill="#a371f7">freelance &amp; collab</tspan></text>
    <text x="360" y="218" fill="#484f58">│</text>
    <text x="380" y="218" fill="#8b949e">based in <tspan fill="#e6edf3">India</tspan></text>
  </g>

  <!-- blinking cursor -->
  <rect x="300" y="179" width="9" height="15" fill="#22d3ee">
    <animate attributeName="opacity" values="1;0" calcMode="discrete" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
