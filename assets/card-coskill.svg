    <rect x="198" y="112" width="78" height="22" rx="6" fill="#141414"/><text x="237" y="127">MongoDB</text>
    <rect x="284" y="112" width="58" height="22" rx="6" fill="#141414"/><text x="313" y="127">Redis</text>
  </g>
