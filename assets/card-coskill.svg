<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" width="400" height="160">
  <defs><style>.disp{font-family:'Space Grotesk','Segoe UI',system-ui,sans-serif}.body{font-family:'Inter','Segoe UI',system-ui,sans-serif}.mono{font-family:'JetBrains Mono','Courier New',monospace}</style></defs>
  <rect x="2" y="2" width="396" height="156" rx="12" fill="#0e0e0e" stroke="#232320"/>
  <rect x="2" y="2" width="4" height="156" rx="2" fill="#c7f94a"/>
  <circle cx="30" cy="30" r="4" fill="#c7f94a"><animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/></circle>
  <text x="44" y="35" class="disp" font-size="19" font-weight="700" fill="#f2f2ee">CoSkill</text>
  <rect x="300" y="18" width="84" height="22" rx="11" fill="none" stroke="#c7f94a" stroke-opacity="0.6"/>
  <text x="342" y="33" text-anchor="middle" class="mono" font-size="9" fill="#c7f94a">● BUILDING</text>
  <text x="26" y="68" class="body" font-size="12" fill="#8a8a82">Skill-sharing platform — connect, teach and</text>
